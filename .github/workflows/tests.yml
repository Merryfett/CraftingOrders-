name: Lua regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run_tests.py
